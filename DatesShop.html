<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dates Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --sand: #F5EAD7;
  --cream: #FBF6EE;
  --brown-deep: #3D1F0D;
  --brown-mid: #7A3B1E;
  --brown-warm: #A85C2C;
  --gold: #C9973A;
  --green-dark: #1E3628;
  --green-mid: #2E5040;
  --red: #C0392B;
  --text: #2A1506;
  --muted: #8B6A50;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--brown-deep);
  padding: 0 20px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 20px rgba(61,31,13,0.4);
}
.header-logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 600;
  color: var(--sand); letter-spacing: 0.04em;
}
.header-logo span { color: var(--gold); font-style: italic; }

.lang-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--sand); padding: 6px 14px;
  border-radius: 20px; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
  transition: background 0.2s;
}
.lang-btn:hover { background: rgba(255,255,255,0.15); }

.cart-btn {
  background: var(--gold); border: none;
  width: 40px; height: 40px; border-radius: 50%;
  cursor: pointer; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, background 0.2s;
  position: relative;
}
.cart-btn:hover { background: #E0A840; transform: scale(1.08); }

.cart-badge {
  position: absolute; top: -3px; right: -3px;
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
.cart-badge.show { display: flex; }

/* ── HERO ── */
.hero {
  background: linear-gradient(135deg, var(--brown-deep) 0%, var(--brown-mid) 60%, var(--brown-warm) 100%);
  padding: 40px 20px 32px; text-align: center;
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 70% 30%, rgba(201,151,58,0.18) 0%, transparent 60%);
}
.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 38px; font-weight: 600;
  color: var(--sand); line-height: 1.1; position: relative;
}
.hero h1 em { color: var(--gold); font-style: italic; }
.hero p {
  color: rgba(245,234,215,0.65); font-size: 13px; margin-top: 8px;
  letter-spacing: 0.08em; text-transform: uppercase; position: relative;
}

/* ── SECTION LABEL ── */
.section-label {
  padding: 24px 20px 8px;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 600;
  color: var(--brown-mid); letter-spacing: 0.02em;
}

/* ── PRODUCT GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px; padding: 8px 16px 24px;
}

.card {
  background: #fff; border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 8px rgba(61,31,13,0.08);
  transition: transform 0.22s, box-shadow 0.22s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(61,31,13,0.14);
}
.card-img {
  width: 100%; height: 130px; object-fit: cover;
  display: block; background: var(--sand);
}
.card-body { padding: 12px; }
.card-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px; font-weight: 600;
  color: var(--brown-deep); line-height: 1.2; margin-bottom: 4px;
}
.card-price {
  font-size: 15px; font-weight: 500;
  color: var(--brown-warm); margin-bottom: 6px;
}
.rating-display {
  font-size: 11px; color: var(--muted);
  margin-bottom: 6px; display: flex; align-items: center; gap: 3px;
}
.rating-display .star-filled { color: var(--gold); }
.stars { display: flex; gap: 2px; margin-bottom: 10px; }
.stars span {
  cursor: pointer; font-size: 15px; color: #D9C4A0;
  transition: color 0.1s; line-height: 1;
}
.stars span:hover, .stars span.hovered { color: var(--gold); }

.add-btn {
  width: 100%; padding: 9px;
  background: var(--green-dark); color: #fff; border: none;
  border-radius: 8px; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
  transition: background 0.2s, transform 0.1s;
}
.add-btn:hover { background: var(--green-mid); }
.add-btn:active { transform: scale(0.97); }

/* ── CART SECTION ── */
.cart-section {
  margin: 0 16px 32px; background: #fff;
  border-radius: 16px; padding: 20px;
  box-shadow: 0 2px 16px rgba(61,31,13,0.08);
  border: 1px solid rgba(61,31,13,0.07);
}

.cart-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid var(--sand);
}
.cart-header h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 600; color: var(--brown-deep);
}

.clear-all-btn {
  font-size: 11px; padding: 5px 11px;
  background: #fff3f3; color: var(--red);
  border: 1px solid #f5c4c0; border-radius: 20px;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  font-weight: 500; transition: background 0.2s;
  display: none;
}
.clear-all-btn.show { display: inline-block; }
.clear-all-btn:hover { background: #fde8e6; }

.cart-empty {
  color: var(--muted); font-size: 13px;
  padding: 14px 0; text-align: center; font-style: italic;
}

/* Cart item row */
.cart-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px dashed #EDE0CE; font-size: 14px;
  animation: slideIn 0.18s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: none; }
}

.cart-item-left { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.cart-item-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cart-item-price { color: var(--brown-warm); font-weight: 500; white-space: nowrap; margin-left: 8px; }

.remove-btn {
  background: none; border: none; color: #ccc;
  cursor: pointer; font-size: 14px; line-height: 1;
  padding: 3px 6px; border-radius: 4px;
  transition: color 0.15s, background 0.15s; flex-shrink: 0;
}
.remove-btn:hover { color: var(--red); background: #fff0ee; }

.cart-total {
  display: flex; justify-content: space-between;
  padding: 12px 0 16px; font-weight: 500;
  font-size: 15px; color: var(--brown-deep);
}
.cart-total span:last-child {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 600; color: var(--brown-warm);
}

/* ── FORM ── */
.form-field {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid #E8DAC8; border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--text);
  background: var(--cream); margin-bottom: 10px;
  transition: border-color 0.2s; outline: none;
}
.form-field:focus { border-color: var(--gold); }
.form-field::placeholder { color: var(--muted); }
.form-field.error { border-color: var(--red); }

.phone-hint {
  font-size: 11px; color: var(--red);
  margin-top: -6px; margin-bottom: 8px;
  display: none; padding-left: 4px;
}
.phone-hint.visible { display: block; }

.checkout-btn {
  width: 100%; padding: 13px;
  background: var(--green-dark); color: #fff; border: none;
  border-radius: 10px; cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500; letter-spacing: 0.04em;
  display: flex; align-items: center; justify-content: center;
  gap: 8px; transition: background 0.2s, opacity 0.2s; margin-top: 10px;
}
.checkout-btn:hover:not(:disabled) { background: var(--green-mid); }
.checkout-btn:disabled { background: #b0b0b0; cursor: not-allowed; opacity: 0.65; }

.messenger-btn {
  background: #0084FF;
}
.messenger-btn:hover:not(:disabled) { background: #0070db; }
.messenger-btn:disabled { background: #b0b0b0; }

.sms-btn {
  background: #7B2FBE;
}
.sms-btn:hover:not(:disabled) { background: #6A28A5; }
.sms-btn:disabled { background: #b0b0b0; }

.order-divider {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 0 4px;
}
.order-divider span {
  font-size: 11px; color: var(--muted); white-space: nowrap;
  letter-spacing: 0.05em; text-transform: uppercase;
}
.order-divider::before, .order-divider::after {
  content: ''; flex: 1; height: 1px; background: #E8DAC8;
}

/* ── DIVIDER ── */
.divider {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--sand), transparent);
  margin: 0 20px 20px;
}

/* ── ORDER CONFIRMATION MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(30,10,2,0.55);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.28s ease;
}
.modal-overlay.open {
  opacity: 1; pointer-events: all;
}

.modal {
  background: #fff; border-radius: 20px;
  padding: 28px 24px 24px;
  width: 100%; max-width: 360px;
  box-shadow: 0 20px 60px rgba(30,10,2,0.25);
  transform: translateY(24px) scale(0.97);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  max-height: 90vh; overflow-y: auto;
}
.modal-overlay.open .modal {
  transform: translateY(0) scale(1);
}

/* Checkmark animation */
.modal-check {
  width: 60px; height: 60px;
  background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
  border-radius: 50%; margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  box-shadow: 0 4px 18px rgba(30,54,40,0.3);
  animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.1s both;
}
@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

.modal-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; font-weight: 600;
  color: var(--brown-deep); text-align: center;
  margin-bottom: 4px;
}
.modal-subtitle {
  font-size: 12px; color: var(--muted);
  text-align: center; margin-bottom: 20px;
  letter-spacing: 0.04em;
}

/* Order ID pill */
.order-id {
  background: var(--sand); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 18px;
  display: flex; justify-content: space-between; align-items: center;
}
.order-id-label { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.order-id-value { font-family: 'Cormorant Garamond', serif; font-size: 17px; font-weight: 600; color: var(--brown-mid); letter-spacing: 0.08em; }

/* Order items summary */
.modal-items { margin-bottom: 14px; }
.modal-item {
  display: flex; justify-content: space-between;
  padding: 7px 0; border-bottom: 1px dashed #EDE0CE;
  font-size: 13px;
}
.modal-item:last-child { border-bottom: none; }
.modal-item-name { color: var(--text); }
.modal-item-price { color: var(--brown-warm); font-weight: 500; }

/* Total row */
.modal-total {
  display: flex; justify-content: space-between;
  background: var(--brown-deep); color: #fff;
  border-radius: 10px; padding: 12px 14px;
  margin-bottom: 14px;
}
.modal-total-label { font-size: 13px; opacity: 0.8; }
.modal-total-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 20px; font-weight: 600; color: var(--gold);
}

/* Customer info */
.modal-info {
  background: var(--cream); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 20px;
  font-size: 13px; color: var(--text); line-height: 1.9;
}
.modal-info span { color: var(--muted); font-size: 11px; margin-right: 4px; }

/* Whatsapp notice */
.modal-notice {
  font-size: 11px; color: var(--muted);
  text-align: center; margin-bottom: 18px;
  line-height: 1.5; padding: 0 8px;
}

/* Buttons */
.modal-btn-row { display: flex; gap: 10px; }
.modal-btn-done {
  flex: 1; padding: 12px;
  background: var(--green-dark); color: #fff; border: none;
  border-radius: 10px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
  transition: background 0.2s;
}
.modal-btn-done:hover { background: var(--green-mid); }
.modal-btn-retry {
  flex: 1; padding: 12px;
  background: #fff; color: var(--brown-mid);
  border: 1.5px solid #E8DAC8; border-radius: 10px; cursor: pointer;
  font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
  transition: background 0.2s;
}
.modal-btn-retry:hover { background: var(--sand); }
</style>
</head>
<body>

<header>
  <button class="lang-btn" onclick="toggleLang()">🌐 <span id="langText">EN</span></button>
  <div class="header-logo" id="headerLogo">Dates <span>Shop</span></div>
  <button class="cart-btn" onclick="scrollCart()">
    🛒<span class="cart-badge" id="cartBadge">0</span>
  </button>
</header>

<div class="hero">
  <h1 id="heroTitle">Premium <em>Dates</em></h1>
  <p id="heroSub">Handpicked · Fresh · Delivered</p>
</div>

<div class="section-label" id="sectionTitle">Our Collection</div>
<div class="grid" id="products"></div>

<div class="divider"></div>

<!-- ── ORDER CONFIRMATION MODAL ── -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-check">✓</div>
    <div class="modal-title" id="modalTitle">Order Placed!</div>
    <div class="modal-subtitle" id="modalSubtitle">Your order has been sent</div>

    <div class="order-id">
      <span class="order-id-label" id="modalOrderLabel">Order ID</span>
      <span class="order-id-value" id="modalOrderId">#000000</span>
    </div>

    <div class="modal-items" id="modalItems"></div>

    <div class="modal-total">
      <span class="modal-total-label" id="modalTotalLabel">Total</span>
      <span class="modal-total-value"><span id="modalTotal">0</span>৳</span>
    </div>

    <div class="modal-info" id="modalInfo"></div>

    <div class="modal-notice" id="modalNotice">
      Please send the message to confirm your order.
    </div>

    <div class="modal-btn-row">
      <button class="modal-btn-retry" onclick="retryWhatsApp()" id="modalRetryBtn">↗ Resend</button>
      <button class="modal-btn-done" onclick="closeModal()" id="modalDoneBtn">✓ Done</button>
    </div>
  </div>
</div>

<div class="cart-section" id="cartBox">
  <div class="cart-header">
    <h3 id="cartTitle">Your Cart</h3>
    <button class="clear-all-btn" id="clearAllBtn" onclick="clearCart()">🗑 Clear All</button>
  </div>
  <div id="cart"></div>
  <div class="cart-total">
    <span id="totalLabel">Total</span>
    <span><span id="total">0</span>৳</span>
  </div>
  <input class="form-field" id="name"    placeholder="Name">
  <input class="form-field" id="phone" placeholder="Phone (Required) *" oninput="onPhoneInput()" inputmode="numeric" maxlength="11">
  <div class="phone-hint" id="phoneHint">📵 Phone number is required to place an order</div>
  <input class="form-field" id="address" placeholder="Delivery Address">
  <button class="checkout-btn" id="checkoutBtn" onclick="checkout('whatsapp')" disabled>
    <span id="checkoutIcon">🔒</span>
    <span id="orderBtn">Enter valid phone to order</span>
  </button>

  <div class="order-divider"><span id="orLabel">or order via</span></div>

  <div style="display:flex;gap:10px;">
    <button class="checkout-btn messenger-btn" id="messengerBtn" onclick="checkout('messenger')" disabled style="margin-top:0;flex:1">
      <span>💬</span>
      <span id="messengerBtnLabel">Messenger</span>
    </button>
    <button class="checkout-btn sms-btn" id="smsBtn" onclick="checkout('sms')" disabled style="margin-top:0;flex:1">
      <span>📱</span>
      <span id="smsBtnLabel">SMS</span>
    </button>
  </div>
</div>

/* ── Helpers ── */
function avg(r) {
  if (!r.length) return 0;
  return (r.reduce((a,b) => a+b, 0) / r.length).toFixed(1);
}

/* ── Rating ── */
function rateProduct(i, stars) {
  products[i].ratings.push(stars);
  renderProducts();
}
function hoverStars(i, n) {
  document.querySelectorAll(`#stars-${i} span`).forEach((s, idx) => {
    s.classList.toggle('hovered', idx < n);
  });
}
function resetStars(i) {
  document.querySelectorAll(`#stars-${i} span`).forEach(s => s.classList.remove('hovered'));
}

/* ── Products ── */
function renderProducts() {
  const tx = t[lang];
  let html = "";
  products.forEach((p, i) => {
    const name   = lang === "en" ? p.name_en : p.name_bn;
    const avgR   = avg(p.ratings);
    const count  = p.ratings.length;
    const filled = Math.round(avgR);
    const dispStars = Array.from({length:5}, (_,s) =>
      `<span class="${s < filled ? 'star-filled':''}">${s < filled ? '★':'☆'}</span>`
    ).join('');

    html += `
    <div class="card">
      <img class="card-img" src="${p.img}" alt="${name}" loading="lazy">
      <div class="card-body">
        <div class="card-name">${name}</div>
        <div class="card-price">${p.price}৳</div>
        <div class="rating-display">${dispStars}
          <span style="margin-left:3px">${count > 0 ? avgR+' ('+count+')' : '—'}</span>
        </div>
        <div class="stars" id="stars-${i}">
          ${[1,2,3,4,5].map(s=>`<span onclick="rateProduct(${i},${s})"
            onmouseenter="hoverStars(${i},${s})"
            onmouseleave="resetStars(${i})">★</span>`).join('')}
        </div>
        <button class="add-btn" onclick="addToCart(${i})">${tx.addBtn}</button>
      </div>
    </div>`;
  });
  document.getElementById("products").innerHTML = html;
}

/* ── Labels ── */
function updateLabels() {
  const tx = t[lang];
  document.getElementById("headerLogo").innerHTML   = tx.logo;
  document.getElementById("heroTitle").innerHTML    = tx.heroTitle;
  document.getElementById("heroSub").innerText      = tx.heroSub;
  document.getElementById("sectionTitle").innerText = tx.collection;
  document.getElementById("cartTitle").innerText    = tx.cartTitle;
  document.getElementById("totalLabel").innerText   = tx.totalLabel;
  document.getElementById("clearAllBtn").innerText        = tx.clearAll;
  document.getElementById("phoneHint").innerText          = tx.phoneHint;
  document.getElementById("langText").innerText           = tx.lang;
  document.getElementById("messengerBtnLabel").innerText  = tx.messengerBtn;
  document.getElementById("smsBtnLabel").innerText        = tx.smsBtn;
  document.getElementById("orLabel").innerText            = tx.orLabel;
}

function show() {
  updateLabels();
  renderProducts();
  updateCart();
  onPhoneInput();
}

/* ── Cart ── */
function addToCart(i) {
  cart.push({ ...products[i], _uid: uid++ });
  updateCart();
  const b = document.getElementById('cartBadge');
  b.style.transform = 'scale(1.6)';
  setTimeout(() => b.style.transform = 'scale(1)', 200);
}

function removeItem(itemUid) {
  const idx = cart.findIndex(c => c._uid === itemUid);
  if (idx !== -1) cart.splice(idx, 1);
  updateCart();
}

function clearCart() {
  if (!cart.length) return;
  cart = [];
  updateCart();
}

function updateCart() {
  const tx = t[lang];
  let html = "", total = 0;

  if (cart.length === 0) {
    html = `<div class="cart-empty">${tx.emptyCart}</div>`;
  } else {
    cart.forEach(item => {
      const name = lang === "en" ? item.name_en : item.name_bn;
      html += `
      <div class="cart-item">
        <div class="cart-item-left">
          <button class="remove-btn" onclick="removeItem(${item._uid})" title="Remove">✕</button>
          <span class="cart-item-name">${name}</span>
        </div>
        <span class="cart-item-price">${item.price}৳</span>
      </div>`;
      total += item.price;
    });
  }

  document.getElementById("cart").innerHTML = html;
  document.getElementById("total").innerText = total.toLocaleString();

  const badge = document.getElementById("cartBadge");
  badge.innerText = cart.length;
  badge.classList.toggle("show", cart.length > 0);

  document.getElementById("clearAllBtn").classList.toggle("show", cart.length > 0);
}

/* ── Phone validation ── */
function validatePhone(val) {
  const v = val.trim();
  if (v === "")              return "empty";
  if (!/^\d+$/.test(v))     return "nondigit";
  if (!v.startsWith("01"))  return "prefix";
  if (v.length < 11)        return "short";
  if (v.length > 11)        return "long";
  return "ok";
}

function onPhoneInput() {
  const phone  = document.getElementById("phone");
  const btn    = document.getElementById("checkoutBtn");
  const icon   = document.getElementById("checkoutIcon");
  const label  = document.getElementById("orderBtn");
  const hint   = document.getElementById("phoneHint");
  const tx     = t[lang];
  const status = validatePhone(phone.value);
  const valid  = status === "ok";

  btn.disabled = !valid;
  document.getElementById("messengerBtn").disabled = !valid;
  document.getElementById("smsBtn").disabled = !valid;
  icon.textContent  = valid ? "📲" : "🔒";
  label.textContent = valid ? tx.orderBtn : tx.orderBtnLocked;

  // Live hint messages
  const hints = {
    en: {
      empty:    "📵 Phone number is required to place an order",
      nondigit: "⚠️ Numbers only — no spaces or letters",
      prefix:   "⚠️ Number must start with 01",
      short:    `⚠️ Must be 11 digits (${phone.value.trim().length}/11 entered)`,
      long:     "⚠️ Number is too long — must be exactly 11 digits",
      ok:       ""
    },
    bn: {
      empty:    "📵 অর্ডার করতে ফোন নম্বর দিন",
      nondigit: "⚠️ শুধু সংখ্যা দিন — স্পেস বা অক্ষর নয়",
      prefix:   "⚠️ নম্বর অবশ্যই 01 দিয়ে শুরু হতে হবে",
      short:    `⚠️ ১১ সংখ্যা হতে হবে (${phone.value.trim().length}/১১ দেওয়া হয়েছে)`,
      long:     "⚠️ নম্বর বড় — ঠিক ১১ সংখ্যা হতে হবে",
      ok:       ""
    }
  };

  const msg = hints[lang][status];
  if (msg) {
    hint.innerText = msg;
    hint.classList.add("visible");
    phone.classList.toggle("error", status !== "empty");
  } else {
    hint.classList.remove("visible");
    phone.classList.remove("error");
  }
}

/* ── Lang ── */
function toggleLang() {
  lang = lang === "en" ? "bn" : "en";
  show();
}

/* ── Scroll ── */
function scrollCart() {
  document.getElementById("cartBox").scrollIntoView({ behavior: "smooth" });
}

/* ── Checkout ── */
let lastOrderMsg      = "";
let lastOrderSnap     = [];
let lastOrderInfo     = {};
let lastOrderPlatform = "whatsapp";

// Facebook Page ID for Messenger (replace with your actual page ID)
const FB_PAGE_ID = "61567996226757";

function generateOrderId() {
  return '#' + Math.floor(100000 + Math.random() * 900000);
}

function buildOrderMsg(orderId) {
  const name    = document.getElementById("name").value.trim();
  const address = document.getElementById("address").value.trim();
  const phone   = document.getElementById("phone").value.trim();
  const total   = cart.reduce((s,i) => s + i.price, 0);

  let msg = `🛒 New Order ${orderId}\n\n`;
  cart.forEach(item => {
    msg += `${lang === "en" ? item.name_en : item.name_bn} — ${item.price}৳\n`;
  });
  msg += `\n💰 Total: ${total.toLocaleString()}৳`;
  if (name)    msg += `\n👤 Name: ${name}`;
  msg          += `\n📞 Phone: ${phone}`;
  if (address) msg += `\n📍 Address: ${address}`;
  return msg;
}

function checkout(platform) {
  const tx    = t[lang];
  const phone = document.getElementById("phone");

  if (validatePhone(phone.value) !== "ok") {
    phone.classList.add("error");
    onPhoneInput();
    phone.focus();
    return;
  }
  if (cart.length === 0) { alert(tx.cartEmpty); return; }

  const name    = document.getElementById("name").value.trim();
  const address = document.getElementById("address").value.trim();
  const total   = cart.reduce((s,i) => s + i.price, 0);
  const orderId = generateOrderId();

  lastOrderSnap     = [...cart];
  lastOrderInfo     = { name, phone: phone.value.trim(), address, total, orderId };
  lastOrderPlatform = platform;
  lastOrderMsg      = buildOrderMsg(orderId);

  if (platform === "whatsapp") {
    window.open("https://wa.me/8801734568487?text=" + encodeURIComponent(lastOrderMsg));
  } else if (platform === "messenger") {
    window.open("https://m.me/" + FB_PAGE_ID + "?text=" + encodeURIComponent(lastOrderMsg));
  } else if (platform === "sms") {
    // sms: URI — works on Android & iOS to open native SMS app
    const shopPhone = "8801734568487";
    window.open("sms:" + shopPhone + "?body=" + encodeURIComponent(lastOrderMsg));
  }

  openModal(tx, orderId, total, name, phone.value.trim(), address, platform);
}

function openModal(tx, orderId, total, name, phone, address, platform) {
  const isWA = platform === "whatsapp";
  const isMS = platform === "messenger";
  const isSM = platform === "sms";

  document.getElementById("modalTitle").innerText      = tx.modalTitle;
  document.getElementById("modalSubtitle").innerText   = isWA ? tx.modalSubtitleWA : isMS ? tx.modalSubtitleMS : tx.modalSubtitleSM;
  document.getElementById("modalOrderLabel").innerText = tx.modalOrderLabel;
  document.getElementById("modalTotalLabel").innerText = tx.modalTotalLabel;
  document.getElementById("modalNotice").innerText     = isWA ? tx.modalNoticeWA  : isMS ? tx.modalNoticeMS  : tx.modalNoticesSM;
  document.getElementById("modalRetryBtn").innerText   = isWA ? tx.modalRetryWA   : isMS ? tx.modalRetryMS   : tx.modalRetrySM;
  document.getElementById("modalDoneBtn").innerText    = tx.modalDone;

  // Platform colour on checkmark circle
  const check = document.querySelector(".modal-check");
  check.style.background = isWA ? "linear-gradient(135deg,#1E3628,#2E5040)"
    : isMS ? "linear-gradient(135deg,#0056b3,#0084FF)"
    : "linear-gradient(135deg,#5A1F8F,#7B2FBE)";

  document.getElementById("modalOrderId").innerText = orderId;

  let itemsHtml = "";
  lastOrderSnap.forEach(item => {
    const n = lang === "en" ? item.name_en : item.name_bn;
    itemsHtml += `
    <div class="modal-item">
      <span class="modal-item-name">${n}</span>
      <span class="modal-item-price">${item.price}৳</span>
    </div>`;
  });
  document.getElementById("modalItems").innerHTML = itemsHtml;
  document.getElementById("modalTotal").innerText = total.toLocaleString();

  let infoHtml = "";
  if (name)    infoHtml += `<div><span>👤</span>${name}</div>`;
  infoHtml               += `<div><span>📞</span>${phone}</div>`;
  if (address) infoHtml += `<div><span>📍</span>${address}</div>`;
  const platformLabel = isWA ? "WhatsApp" : isMS ? "Messenger" : "SMS";
  const platformIcon  = isWA ? "📲" : isMS ? "💬" : "📱";
  infoHtml += `<div><span>${platformIcon}</span>${platformLabel}</div>`;
  document.getElementById("modalInfo").innerHTML = infoHtml;

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
  cart = [];
  updateCart();
  document.getElementById("name").value    = "";
  document.getElementById("phone").value  = "";
  document.getElementById("address").value = "";
  onPhoneInput();
}

function retryWhatsApp() {
  if (lastOrderPlatform === "whatsapp") {
    window.open("https://wa.me/8801734568487?text=" + encodeURIComponent(lastOrderMsg));
  } else if (lastOrderPlatform === "messenger") {
    window.open("https://m.me/" + FB_PAGE_ID + "?text=" + encodeURIComponent(lastOrderMsg));
  } else {
    window.open("sms:8801734568487?body=" + encodeURIComponent(lastOrderMsg));
  }
}

// Close modal on overlay click
document.getElementById("modalOverlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

show();
